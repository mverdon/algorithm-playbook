<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#3b82f6" rx="15"/>
  
  <!-- Algorithm visualization bars (like a bar chart) -->
  <rect x="15" y="60" width="12" height="25" fill="#ffffff" rx="2"/>
  <rect x="32" y="45" width="12" height="40" fill="#ffffff" rx="2"/>
  <rect x="49" y="30" width="12" height="55" fill="#ffffff" rx="2"/>
  <rect x="66" y="50" width="12" height="35" fill="#ffffff" rx="2"/>
  <rect x="83" y="40" width="12" height="45" fill="#ffffff" rx="2"/>
  
  <!-- Play button overlay -->
  <circle cx="50" cy="50" r="18" fill="rgba(0, 0, 0, 0.3)"/>
  <polygon points="45,40 45,60 63,50" fill="#ffffff"/>
</svg>
